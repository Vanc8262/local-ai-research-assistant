# Only the settings that differ from SearXNG's defaults.
use_default_settings: true

server:
  # The rate limiter protects public instances; this one only listens on 127.0.0.1.
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  # json lets the assistant call /search?q=...&format=json.
  formats:
    - html
    - json

# A backup for when Brave, DuckDuckGo or Google suspend this instance for too many
# requests (a day of evals did, 2026-11-12). Bing is off by default in SearXNG. Tested
# 2026-11-13 and not usable from here: Qwant (access denied), Yahoo and Yep (HTTP errors),
# Mojeek and Startpage (inactive in SearXNG: proof-of-work CAPTCHAs).
engines:
  - name: bing
    disabled: false
