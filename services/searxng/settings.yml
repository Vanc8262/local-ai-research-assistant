# Only the settings that differ from SearXNG's defaults.
use_default_settings: true

server:
  # The rate limiter protects public instances; this one only listens on 127.0.0.1.
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  # json lets the assistant call /search?q=...&format=json.
  formats:
    - html
    - json

# No backup engine is enabled. Tested 2026-11-13 after Brave, DuckDuckGo and Google
# suspended this instance: Bing answers but returns dictionary pages for a research
# question, Qwant denies access, Yahoo and Yep give HTTP errors, and SearXNG marks Mojeek
# and Startpage inactive (proof-of-work CAPTCHAs).

# Topic engines that scrape no search engine (reports/Free web search options 2026.md).
# They sit in the it and science categories, which web_pages.py asks for. Google Scholar
# is turned off because it scrapes Google from the address Google already blocks.
engines:
  - name: hackernews
    disabled: false
  - name: huggingface
    disabled: false
  - name: openalex
    disabled: false
  - name: crossref
    disabled: false
  - name: mwmbl
    disabled: false
  - name: google scholar
    disabled: true
