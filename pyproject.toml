[project]
name = "local-ai-research-assistant"
version = "0.0.1"
description = "Local-first AI research and implementation assistant: model gateway, run log and Stage 0 benchmark harness."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
    "pillow>=10.1",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench*", "assistant*"]

[tool.setuptools.package-data]
bench = ["data/*.json", "data/code_tasks/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
