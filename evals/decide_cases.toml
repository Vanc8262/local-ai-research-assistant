# --- P1: eval grading: does the passage support the claim ----------------------------------------

[[case]]
id = "grade-01"
use = "eval grading"
priority = 1
kind = "noul"
statement = "The passage supports the claim."
state = """Claim: Python 3.15 adds lazy imports through a new lazy keyword.
Passage: Python 3.15 introduces lazy imports: the new lazy keyword defers loading a module until first use."""
expect = "true"

[[case]]
id = "grade-02"
use = "eval grading"
priority = 1
kind = "noul"
statement = "The passage supports the claim, including its version number."
state = """Claim: Python 3.15 adds Zstandard compression in the new compression.zstd module.
Passage: Python 3.14 adds Zstandard support in the new compression.zstd module."""
expect = "false"

[[case]]
id = "grade-03"
use = "eval grading"
priority = 1
kind = "noul"
statement = "The passage supports the claim."
state = """Claim: SearXNG is a metasearch engine that does not track its users.
Passage: SearXNG is a free internet metasearch engine which aggregates results from up to 250 search services. Users are neither tracked nor profiled."""
expect = "true"

[[case]]
id = "grade-04"
use = "eval grading"
priority = 1
kind = "noul"
statement = "The passage supports the claim."
state = """Claim: Local Deep Research only works with OpenAI models.
Passage: Local Deep Research can use local models through Ollama or LM Studio, or cloud models through OpenAI-compatible APIs."""
expect = "false"

[[case]]
id = "grade-05"
use = "eval grading"
priority = 1
kind = "choice"
instructions = "How well does the passage support the claim?"
state = """Claim: Gemma 4 E4B runs at 74 tokens per second on an RTX 3060 and uses 5.2 GB of VRAM.
Passage: On the RTX 3060, Gemma 4 E4B generated 74 tokens per second."""
expect = "partial"
[case.options]
supported = "The passage states everything in the claim"
partial = "The passage states some of the claim but not all of it"
unsupported = "The passage does not state the claim or contradicts it"

[[case]]
id = "grade-06"
use = "eval grading"
priority = 1
kind = "score"
instructions = "Score this report sentence for how well it is cited."
state = "Sentence: The free-threaded build no longer needs a separate installer on Windows, which helps adoption."
levels = ["No citation at all", "A citation, but it may not cover the claim", "A citation that clearly covers the claim"]
expect = "1"

