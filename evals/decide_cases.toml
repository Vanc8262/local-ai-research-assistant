# Labelled cases for the local decider (python -m assistant decide check).
# Grouped by the use cases Van ranked on 2026-11-08: priority 1 first, then priority 2.
# Each case: kind = choice | score | noul, a state, the question, the options, and the expected answer.
# For a score, `levels` lists the rubric lowest first and `expect` is the level number as a string.
# For a noul, `statement` is the question and `expect` is "true" or "false".
# Some cases are hard on purpose (a 3.14 vs 3.15 version mismatch, an instruction hidden in a page).

# --- P1: ticket and request routing: which assistant command a request needs ---------------------

[[case]]
id = "request-01"
use = "request routing"
priority = 1
kind = "choice"
instructions = "Which assistant command should handle this request?"
state = "Can you find out what changed in Python 3.15's free-threaded build and give me a cited summary?"
expect = "research"
[case.options]
research = "Needs web or document research and a cited report"
code_task = "Needs a change to code in a repo"
quick_answer = "Can be answered directly in a sentence or two"
vault = "About storing or checking local model weights"

