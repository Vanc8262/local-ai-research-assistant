expect = "manual"
[case.options]
local = "Gemma 4 E4B: fast default for short writing, summaries and simple judgments"
local-backup = "Qwen3.5 9B: slower, better at multi-step tool calls and recovering from tool errors"
manual = "Hand off to Van for Claude: large, multi-file or design work beyond the local models"

[[case]]
