# --- P1: model routing: which tier should run a step ---------------------------------------------

[[case]]
id = "model-01"
use = "model routing"
priority = 1
kind = "choice"
instructions = "Which model tier should run this step?"
state = "Step: summarise these three search snippets about SearXNG settings into two sentences."
expect = "local"
[case.options]
local = "Gemma 4 E4B: fast default for short writing, summaries and simple judgments"
local-backup = "Qwen3.5 9B: slower, better at multi-step tool calls and recovering from tool errors"
manual = "Hand off to Van for Claude: large, multi-file or design work beyond the local models"

[[case]]
id = "model-02"
use = "model routing"
priority = 1
kind = "choice"
instructions = "Which model tier should run this step?"
state = "Step: call search_web, then read_file on two results, retry if a tool returns an error, and combine what you find. Previous attempt failed after a tool error."
expect = "local-backup"
[case.options]
local = "Gemma 4 E4B: fast default for short writing, summaries and simple judgments"
local-backup = "Qwen3.5 9B: slower, better at multi-step tool calls and recovering from tool errors"
manual = "Hand off to Van for Claude: large, multi-file or design work beyond the local models"

[[case]]
id = "model-03"
use = "model routing"
priority = 1
kind = "choice"
