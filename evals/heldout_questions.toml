# Held-out Stage 2 questions, written 2026-11-15 after the eval review (reports/eval-review-2026-11-14.md).
# Nothing in the code, the checker, the decider or the codex was tuned on these, and nothing should be:
# run them on frozen code, once per mode, and keep any fix they suggest out of the numbers they gave.
#
# All are public (they may run hybrid and use the Tavily fallback). None is marked codex, because the
# codex holds no primary sources for them. `expect` follows research_questions.toml: whole words,
# case-insensitive, optional plural "s", in the report body only; any one spelling in a group counts.
# Each group is a fact a correct answer states, not a word any answer would use.
#
#   python -m assistant eval --questions evals/heldout_questions.toml --runs 1 --mode local --mode hybrid \
#       --record-search runs/snapshots/heldout

[[question]]
public = true
id = "bm25"
topic = "rag"
text = "What is BM25, and what do its k1 and b parameters control?"
expect = [["term frequency"], ["document length", "length normalization", "length normalisation"],
          ["inverse document frequency", "IDF"], ["saturation", "saturates"]]

