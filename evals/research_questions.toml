# Stage 2 research eval. Every question is public, so each one can run both local-only and
# hybrid (Gemini + Tavily). `expect` lists facts a correct answer must mention; matching is
# case-insensitive and any one spelling in a group counts.

[[question]]
id = "python-315"
topic = "python"
text = "What are the main new features in the latest stable Python release?"
expect = [["3.15"], ["lazy import", "lazy keyword"], ["UTF-8"]]

[[question]]
id = "lora-vs-qlora"
topic = "ai-llm"
text = "How does QLoRA reduce memory use compared with LoRA when fine-tuning large language models?"
expect = [["4-bit", "4 bit"], ["NF4", "NormalFloat"], ["double quantization"], ["paged optimizer"]]

[[question]]
id = "aws-pillars"
topic = "cloud"
text = "What are the pillars of the AWS Well-Architected Framework and what does each one cover?"
expect = [["operational excellence"], ["security"], ["reliability"], ["performance efficiency"],
          ["cost optimization"], ["sustainability"]]

[[question]]
id = "gguf-quants"
topic = "local-models"
text = "What do the GGUF quantization types Q4_K_M, Q5_K_M and Q8_0 mean in llama.cpp, and how do they trade size against quality?"
expect = [["Q4_K_M"], ["Q8_0"], ["k-quant", "k quant", "K-quants"], ["perplexity", "quality"]]

[[question]]
id = "self-rag"
topic = "rag"
text = "How does Self-RAG differ from standard retrieval-augmented generation?"
expect = [["reflection token"], ["retriev"], ["critique", "critic"]]
