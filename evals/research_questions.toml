# Stage 2 research eval. A question marked public = true holds nothing private, so it can run
# both local-only and hybrid (Gemini + Tavily). A question without it counts as private: it
# skips hybrid mode and never reaches Tavily. `expect` lists facts a correct answer must mention in its
# body (not the title, which is the question, and not the Sources list). A term matches as whole words,
# case-insensitive, with an optional plural "s"; any one spelling in a group counts. Since the
# 2026-11-14 eval review, no term is a bare word stem.

[[question]]
public = true
id = "python-315"
codex = true
topic = "python"
text = "What are the main new features in Python 3.15?"   # pinned: "latest stable" changed with the date
expect = [["3.15"], ["lazy import", "lazy keyword"], ["UTF-8"]]

[[question]]
public = true
id = "lora-vs-qlora"
codex = true
topic = "ai-llm"
text = "How does QLoRA reduce memory use compared with LoRA when fine-tuning large language models?"
expect = [["4-bit", "4 bit"], ["NF4", "NormalFloat"], ["double quantization"], ["paged optimizer"]]

[[question]]
public = true
id = "aws-pillars"
codex = true
topic = "cloud"
text = "What are the pillars of the AWS Well-Architected Framework and what does each one cover?"
expect = [["operational excellence"], ["security"], ["reliability"], ["performance efficiency"],
          ["cost optimization"], ["sustainability"]]

[[question]]
public = true
id = "gguf-quants"
codex = true
topic = "local-models"
text = "What do the GGUF quantization types Q4_K_M, Q5_K_M and Q8_0 mean in llama.cpp, and how do they trade size against quality?"
expect = [["Q4_K_M"], ["Q8_0"], ["k-quant", "k quant"], ["perplexity", "quality loss", "loss of quality",
          "lower quality", "higher quality", "better quality"]]

[[question]]
public = true
id = "self-rag"
codex = true
topic = "rag"
text = "How does Self-RAG differ from standard retrieval-augmented generation?"
expect = [["reflection token"], ["retrieve token", "[Retrieve]", "on-demand retrieval", "retrieval on demand",
          "adaptive retrieval", "when to retrieve", "whether to retrieve"], ["critique", "critic"]]
