# Stage 0 benchmark settings. Run `python -m bench models` to see the exact
# model ids your LM Studio server reports, then edit the [[models]] blocks.

[server]
# 127.0.0.1, not localhost: on Windows "localhost" tries IPv6 first and every
# request waited about 2.3 s before falling back, which inflated time to first token.
base_url = "http://127.0.0.1:1234/v1"   # LM Studio's OpenAI-compatible server
api_key = "lm-studio"                   # any text unless you set a permission key
timeout_s = 900

[defaults]
temperature = 0.0     # only for models without their own setting below
max_tokens = 6000     # includes reasoning tokens; 3000 cut off both models mid-reasoning. At 8K context, ~7000 is the ceiling.
seed = 42
speed_repeats = 3
code_attempts = 2     # 1 = single shot; 2 = one retry with the test output
context_length = 8192 # what you loaded the model with; recorded and checked

# Sampling follows each maker's recommendation for reasoning mode. At temperature 0
# both models often reasoned until they hit max_tokens (a loop is suspected; the next
# run records reasoning_tail and loop_suspected to confirm).

[[models]]
id = "qwen3.5-9b"
label = "Qwen3.5 9B"
vision = true
temperature = 0.6     # Qwen's thinking-mode preset for precise coding
extra_body = { top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0 }

[[models]]
id = "gemma-4-12b-qat"
label = "Gemma 4 12B QAT"
vision = true
temperature = 1.0     # Google's default for Gemma 4
extra_body = { top_p = 0.95, top_k = 64 }

# Optional per-model settings:
#   temperature = 0.6
#   max_tokens = 4000
#   system_suffix = "/no_think"            # appended to every system prompt
#   extra_body = { reasoning_effort = "low" }  # merged into every request body
