# Services that run in Docker (WSL2). LM Studio stays on the Windows host for GPU access.
#
#   docker compose up -d       start
#   docker compose down        stop
#
# Ports are bound to 127.0.0.1 only, so nothing is reachable from the local network.
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      # Any random text; only used to sign cookies. Override it in a git-ignored .env file.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-only-change-me}
    mem_limit: 1g
    restart: unless-stopped

  # Offline copies for the search router (assistant/sources.py): every .zim file in KIWIX_DIR,
  # downloaded by scripts/get_kiwix.ps1. Measured at about 50 MB of RAM with one small ZIM.
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: kiwix
    command: ["*.zim"]
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ${KIWIX_DIR:-D:/kiwix}:/data:ro
    mem_limit: 512m
    restart: unless-stopped
